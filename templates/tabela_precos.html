{% extends "base.html" %}

{% block titulo %}Tabela de Preços{% endblock %}

{% block conteudo %}

<div class="container-fluid">

    <h2 class="mb-4">
        💰 Tabela de Preços por Credenciada
    </h2>

    <form method="GET">

        <div class="row mb-4">

    <div class="col-md-4">

        <label class="form-label">
            Credenciada
        </label>

        <select
            name="credenciada"
            class="form-select"
            onchange="this.form.submit()">

            <option value="">Selecione...</option>

            {% for c in credenciadas %}

            <option
                value="{{ c.id }}"
                {% if credenciada_id|int == c.id %}selected{% endif %}>

                {{ c.nome }}

            </option>

            {% endfor %}

        </select>

    </div>

    <div class="col-md-6">

        <label class="form-label">
            Pesquisar exame
        </label>

        <input
            type="text"
            name="pesquisa"
            class="form-control"
            placeholder="Digite o nome do exame..."
            value="{{ pesquisa }}">

    </div>

    <div class="col-md-2 d-grid">

        <label class="form-label">&nbsp;</label>

        <button
            type="submit"
            class="btn btn-primary">

            🔎 Pesquisar

        </button>

    </div>

</div>

                

    </form>

    {% if exames %}

    <form method="POST">

        <input
            type="hidden"
            name="credenciada_id"
            value="{{ credenciada_id }}">

            <input
        type="hidden"
        name="pesquisa"
        value="{{ pesquisa }}">

        <div class="card shadow-sm">

            <div class="card-header">

                <strong>

                    Tabela de Preços

                </strong>

            </div>

            <div class="card-body">

                <table class="table table-striped table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Exame</th>

                            <th width="220">

                                Valor (R$)

                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for exame in exames %}

                        <tr>

                            <td>

                                {{ exame.nome }}

                            </td>

                            <td>

                                <input
                                    type="number"
                                    step="0.01"
                                    min="0"
                                    class="form-control"
                                    name="valor_{{ exame.id }}"
                                    value="{{ exame.valor }}">

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-success">

                        💾 Salvar Tabela de Preços

                    </button>

                </div>

            </div>

        </div>

    </form>

    {% endif %}

</div>

{% endblock %}
