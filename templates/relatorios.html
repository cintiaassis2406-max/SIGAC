{% extends "base.html" %}

{% block titulo %}
Relatórios
{% endblock %}

{% block conteudo %}

<div class="container-fluid">

    <h2 class="mb-4">
        📊 Relatórios
    </h2>

    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <strong>Filtros</strong>

        </div>

        <div class="card-body">

            <form method="GET" action="/financeiro">

                <div class="row">

                    <div class="col-md-4">

                        <label class="form-label">
                            Credenciada
                        </label>

                        <select
                            name="credenciada"
                            class="form-select">

                            <option value="">
                                Todas
                            </option>

                            {% for c in credenciadas %}

                            <option
                                value="{{ c.id }}">

                                {{ c.nome }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">
                            Mês
                        </label>

                        <select
                            name="mes"
                            class="form-select">

                            <option value="">Todos</option>

                            {% for i in range(1,13) %}

                            <option value="{{ i }}">

                                {{ "%02d"|format(i) }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">
                            Ano
                        </label>

                        <input
                            type="number"
                            name="ano"
                            class="form-control"
                            value="2026">

                    </div>

                    <div class="col-md-2 d-grid">

                        <label class="form-label">
                            &nbsp;
                        </label>

                        <button
                            class="btn btn-primary">

                            🔍 Consultar

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-header">

            <strong>Exportação</strong>

        </div>

        <div class="card-body">

            <div class="d-flex gap-3">

                <a
                    href="/gerar_pdf"
                    class="btn btn-danger">

                    📄 Gerar PDF

                </a>

                <a
                    href="/gerar_excel"
                    class="btn btn-success">

                    📊 Gerar Excel

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
