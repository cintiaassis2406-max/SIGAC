{% extends "base.html" %}

{% block titulo %}
Empresas
{% endblock %}

{% block conteudo %}

<div class="container-fluid">

    <h2 class="mb-4">
        🏢 Cadastro de Empresas
    </h2>

    <!-- Cadastro -->

    <div class="card mb-4">

        <div class="card-header">
            Nova Empresa
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        <strong>Credenciada</strong>
                    </label>

                    <select
                        name="credenciada_id"
                        class="form-select"
                        required>

                        <option value="">
                            Selecione...
                        </option>

                        {% for c in credenciadas %}

                        <option value="{{ c.id }}">
                            {{ c.nome }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        <strong>Nome da Empresa</strong>
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    💾 Salvar Empresa

                </button>

            </form>

        </div>

    </div>

    <!-- Lista -->

    <div class="card">

        <div class="card-header">

            Empresas Cadastradas

        </div>

        <div class="card-body">

            <form method="GET" class="mb-3">

                <div class="input-group">

                    <input
                        type="text"
                        name="pesquisa"
                        class="form-control"
                        placeholder="Pesquisar empresa..."
                        value="{{ pesquisa }}">

                    <button
                        class="btn btn-primary">

                        🔍 Pesquisar

                    </button>

                </div>

            </form>

            <table class="table table-striped table-hover">
                                <thead>

                    <tr>

                        <th>Empresa</th>
                        <th>Credenciada</th>
                        <th width="180">Ações</th>

                    </tr>

                </thead>

                <tbody>

                    {% for empresa in empresas %}

                    <tr>

                        <td>{{ empresa.nome }}</td>

                        <td>{{ empresa.credenciada }}</td>

                        <td>

                            <a
                                href="/editar_empresa/{{ empresa.id }}"
                                class="btn btn-warning btn-sm">

                                ✏️ Editar

                            </a>

                            <a
                                href="/excluir_empresa/{{ empresa.id }}"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('Deseja realmente excluir esta empresa?')">

                                🗑️ Excluir

                            </a>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
